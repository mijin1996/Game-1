<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    /* 브라우저 창(또는 itch.io 영역)을 꽉 채우고, 스크롤·여백 없음 */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #unity-canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
               color: #fff; font-family: sans-serif; font-size: 16px; gap: 12px; }
    #bar { width: 50%; max-width: 320px; height: 8px; background: #333; border-radius: 4px; overflow: hidden; }
    #fill { width: 0%; height: 100%; background: #9be15d; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading"><div>{{{ PRODUCT_NAME }}}</div><div id="bar"><div id="fill"></div></div></div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    createUnityInstance(document.querySelector("#unity-canvas"), {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
      memoryUrl: "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      matchWebGLToCanvasSize: true,                            // 캔버스 크기 = 게임 해상도
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2) // 휴대폰에서 선명하게, 너무 무겁지 않게
    }, function (p) {
      document.getElementById("fill").style.width = (p * 100) + "%";
    }).then(function () {
      document.getElementById("loading").remove();
    }).catch(function (e) {
      document.getElementById("loading").textContent = "로딩 실패 : " + e;
    });
  </script>
</body>
</html>
